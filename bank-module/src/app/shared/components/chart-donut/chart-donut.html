<div class="min-w-0 h-full w-full bg-white rounded-3xl p-6 shadow-sm border border-zinc-200">
  <h2 class="font-semibold pb-5">Gastos por categoria</h2>

  <!-- GRÁFICO -->
  <apx-chart
    [series]="chartSeries"
    [chart]="chartDetails"
    [labels]="chartLabels"
    [colors]="chartColors"
    [plotOptions]="plotOptions"
    [dataLabels]="dataLabels"
    [legend]="legend"
  >
  </apx-chart>

  <!-- LEGENDA -->
  <div class="flex flex-wrap gap-3 w-full justify-end">
    <div *ngFor="let item of categories">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full" [style.background]="item.color"></div>

        <span>
          {{ item.name }}
        </span>
      </div>

      <span>
        {{ item.value }}
      </span>
    </div>
  </div>
</div>
