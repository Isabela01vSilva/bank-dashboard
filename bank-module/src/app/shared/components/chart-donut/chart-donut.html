<div
  class="bg-white rounded-3xl p-6 shadow-sm border border-zinc-200 flex items-center justify-between"
>
  <!-- GRÁFICO -->
  <div class="w-[280px]">
    <apx-chart
      [series]="chartSeries"
      [chart]="chartDetails"
      [labels]="chartLabels"
      [colors]="chartColors"
      [plotOptions]="plotOptions"
      [dataLabels]="dataLabels"
      [legend]="legend"
    >
    </apx-chart>
  </div>

  <!-- LEGENDA -->
  <div class="flex flex-col gap-3 w-full justify-end">
    <div
      *ngFor="let item of categories"
      class="flex items-center justify-end"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-3 h-3 rounded-full"
          [style.background]="item.color"
        ></div>

        <span class="text-zinc-600">
          {{ item.name }}
        </span>
      </div>

      <span class="font-medium text-zinc-800">
        {{ item.value }}
      </span>
    </div>
  </div>
</div>
