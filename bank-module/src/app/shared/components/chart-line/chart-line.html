<div class="min-w-0 h-full w-full bg-white rounded-3xl p-6 shadow-sm border border-zinc-200">
  <div class="flex items-center flex-wrap justify-between mb-4">
    <h2 class="text-lg font-semibold text-zinc-800">Fluxo mensal</h2>

    <div class="flex gap-4 text-sm">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-600"></span>
        Entradas
      </div>

      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        Saídas
      </div>
    </div>
  </div>

  <!-- GRÁFICO -->
  <div class="w-full h-full items-center justify-center flex py-5">
    <apx-chart
      class="block w-full"
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [tooltip]="chartOptions.tooltip"
      [xaxis]="chartOptions.xaxis"
      [plotOptions]="chartOptions.plotOptions"
      [dataLabels]="chartOptions.dataLabels"
      [stroke]="chartOptions.stroke"
      [colors]="chartOptions.colors"
      [legend]="chartOptions.legend"
      [grid]="chartOptions.grid"
      [yaxis]="chartOptions.yaxis"
    >
    </apx-chart>
  </div>
</div>
