<div class="flex flex-col gap-4">
  <app-header title="Transações" subtitle="Histórico completo de movimentações">
    <!-- Botão Nova TRANSAÇÃO -->
    <button
      class="flex min-h-9 items-center gap-2 rounded-xl bg-primary px-5 text-sm font-medium text-primary-foreground hover:bg-primary/90"
    >
      <lucide-icon [img]="Plus" class="w-4 h-4"></lucide-icon>
      <span>Nova transação</span>
    </button>
  </app-header>

  <!-- Local de Pesquisa/Filtro -->
  <div class="flex flex-wrap justify-between gap-2">
    <!-- Campo de Busca -->
    <div class="flex h-9 flex-1 items-center gap-2 rounded-xl bg-secondary px-3">
      <lucide-icon [img]="Search" class="h-4 w-4 text-muted-foreground"></lucide-icon>
      <input
        type="text"
        class="flex-1 bg-transparent text-sm placeholder:text-muted-foreground focus:outline-none"
        placeholder="Buscar transação..."
      />
    </div>

    <!-- Buscar -->
    <div class="flex gap-3">
      <button
        class="flex h-9 items-center gap-2 rounded-xl border border-border bg-card px-3 text-xs font-medium text-muted-foreground hover:text-foreground"
      >
        <lucide-icon [img]="Filter" class="w-4 h-4"></lucide-icon>
        <span>Filtrar</span>
      </button>
    </div>
  </div>

  <!-- Botoes filtrar -->
  <div class="w-full grid grid-cols-3 bg-secondary p-1 rounded-xl px-4 py-1 text-slate-600">
    <button class="rounded-lg px-4 py-2 text-sm font-medium bg-card text-foreground shadow-sm">
      <span>Todas</span>
    </button>
    <button
      class="rounded-lg px-4 py-2 text-sm font-medium text-muted-foreground hover:text-foreground"
    >
      <span>Entradas</span>
    </button>
    <button
      class="rounded-lg px-4 py-2 text-sm font-medium text-muted-foreground hover:text-foreground"
    >
      <span>Saídas</span>
    </button>
  </div>

  <!-- Transição -->
  <app-recent-transactions [showButtonExportar]="true"></app-recent-transactions>
</div>
