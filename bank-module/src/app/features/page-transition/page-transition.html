<app-header title="Transações" subtitle="Histórico completo de movimentações">
  <!-- NOTIFICATION -->
  <button
    class="rounded-2xl px-4 py-1 gap-4 bg-violet-600 text-white flex items-center justify-center hover:bg-violet-500 transition-all"
  >
    <lucide-icon [img]="Plus" class="w-4 h-4"></lucide-icon>
    <span>Nova transação</span>
  </button>
</app-header>

<div class="flex justify-between gap-2">
  <div class="flex bg-slate-200 rounded-2xl w-full items-center px-3 gap-2">
    <lucide-icon [img]="Search" class="w-4 h-4 text-slate-600"></lucide-icon>
    <input
      type="text"
      class="w-full outline-none focus:outline-none focus:ring-0"
      placeholder="Buscar transação"
    />
  </div>

  <!-- Buscar -->
  <div class="flex gap-3">
    <button class="flex gap-2 items-center bg-slate-200 rounded-2xl px-4 py-1 text-slate-600">
      <lucide-icon [img]="Filter" class="w-4 h-4"></lucide-icon>
      <span>Filtrar</span>
    </button>
    <button class="flex gap-2 items-center bg-slate-200 rounded-2xl px-4 py-1 text-slate-600">
      <lucide-icon [img]="Upload" class="w-4 h-4"></lucide-icon>
      <span>Exportar</span>
    </button>
  </div>
</div>
