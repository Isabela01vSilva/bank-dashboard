<aside
  class="relative h-screen bg-white border-r border-slate-200 transition-all duration-300 overflow-hidden flex flex-col"
  [class.w-[260px]]="!collapsed()"
  [class.w-[72px]]="collapsed()"
>
  <nav class="flex flex-col gap-2 p-2">
    @for (group of menuGroups; track group.title) {
      @if (!collapsed()) {
        <p class="mt-4 px-4 text-xs font-semibold uppercase tracking-wider text-slate-400">
          {{ group.title }}
        </p>
      }

      @for (item of group.items; track item.label) {
        <a
          class="flex items-center px-4 py-3 rounded-2xl transition-all duration-300 hover:bg-slate-100 hover:text-slate-900"
          [class.justify-center]="collapsed()"
          [class.gap-3]="!collapsed()"
        >
          <lucide-icon [img]="item.icon" class="w-5 h-5"> </lucide-icon>

          @if (!collapsed()) {
            <span>
              {{ item.label }}
            </span>
          }
        </a>
      }
    }
  </nav>

  <!-- FOOTER -->
  <div class="mt-auto p-4 flex justify-center">
    <button
      (click)="toggleSidebar()"
      class="border border-slate-200 rounded-full p-2 shadow-sm hover:bg-slate-100 transition-all duration-300"
    >
      <lucide-icon [img]="!collapsed() ? PanelRightClose : PanelLeftClose" class="w-4 h-4">
      </lucide-icon>
    </button>
  </div>
</aside>
