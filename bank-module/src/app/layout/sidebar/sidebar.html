<aside
  class="relative h-screen bg-white border-r border-slate-200 transition-[width] duration-300 ease-in-out overflow-visible flex flex-col"
  [class.w-[260px]]="!collapsed()"
  [class.w-[72px]]="collapsed()"
>
  <nav class="flex flex-col gap-2 p-2">
    <!-- LOGO -->
    <div class="flex items-center gap-3 px-4 py-4 border-b border-slate-200 mb-2">
      <div
        class="min-w-12 min-h-12 bg-gradient-to-br from-violet-500 to-purple-800 flex items-center justify-center transition-all duration-300"
        [class.rounded-full]="collapsed()"
        [class.rounded-3xl]="!collapsed()"
        [class.scale-90]="collapsed()"
      >
        <lucide-icon [img]="Wallet" class="text-white"></lucide-icon>
      </div>

      <span
        class="font-semibold text-slate-800 transition-all duration-300 whitespace-nowrap overflow-hidden"
        [class.opacity-0]="collapsed()"
        [class.w-0]="collapsed()"
      >
        Projeto Bank
      </span>
    </div>

    <!-- MENU GROUPS -->
    @for (group of menuGroups; track group.title) {
      @if (!collapsed()) {
        <p
          class="mt-2 px-4 text-xs font-semibold uppercase tracking-wider text-slate-400 transition-all duration-500"
        >
          {{ group.title }}
        </p>
      }
      @for (item of group.items; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary text-primary-foreground shadow-sm"
          [routerLinkActiveOptions]="{ exact: true }"

          class="flex items-center px-4 py-3 rounded-2xl transition-all text-slate-600 duration-500 hover:bg-slate-100 hover:text-slate-900"
          [class.justify-center]="collapsed()"
          [class.gap-3]="!collapsed()"
        >
          <lucide-icon [img]="item.icon" class="w-5 h-5"> </lucide-icon>

          <span
            class="overflow-hidden whitespace-nowrap transition-all duration-300"
            [class.opacity-0]="collapsed()"
            [class.w-0]="collapsed()"
            [class.max-w-[160px]]="!collapsed()"
          >
            {{ item.label }}
          </span>
        </a>
      }
    }
  </nav>

  <!-- TOGGLE BUTTON -->
  <div class="mt-auto p-4 flex justify-center">
    <button
      (click)="toggleSidebar()"
      class="absolute top-18 -right-4 w-8 h-8 flex items-center justify-center rounded-full border border-slate-200 bg-white shadow-md hover:bg-slate-100 transition-all duration-500"
    >
      <lucide-icon
        [img]="!collapsed() ? ArrowLeftToLine : ArrowRightFromLine"
        class="w-4 h-4 text-slate-500"
      >
      </lucide-icon>
    </button>
  </div>

  <!-- FOOTER -->
  @if (!collapsed()) {
    <div class="border-t border-slate-200 p-4 text-xs text-slate-500">
      <div class="bg-slate-100 rounded-2xl p-3 flex items-center justify-between w-full">
        <!-- LADO ESQUERDO -->
        <div class="flex flex-col gap-1">
          <!-- TÍTULO -->
          <div class="flex items-start gap-1 mb-2">
            <lucide-icon [img]="Landmark" class="w-4 h-4"></lucide-icon>
            <p class="uppercase tracking-wider">Dados da conta</p>
          </div>

          <!-- INFO -->
          <p>
            Ag <span class="text-slate-800 tracking-wider">{{ ag }}</span>
          </p>
          <p>
            Cc <span class="text-slate-800 tracking-wider">{{ cc }}</span>
          </p>
        </div>

        <!-- BOTÃO COPIAR -->
        <button
          (click)="copyInfo()"
          class="p-2 rounded-xl hover:bg-violet-100 hover:text-violet-500 transition-all duration-300 flex items-center justify-center"
        >
          <lucide-icon
            [img]="copied ? Check : Copy"
            class="w-4 h-4 transition-all duration-300"
            [class.scale-125]="copied"
            [class.text-green-500]="copied"
          ></lucide-icon>
        </button>
      </div>
    </div>
  }
</aside>
