<aside
  class="relative sticky top-0 flex h-screen flex-col overflow-visible border-r border-border bg-sidebar text-sidebar-foreground transition-[width] duration-300 ease-in-out"
  [class.w-[240px]]="!collapsed()"
  [class.w-[72px]]="collapsed()"
>
  <!-- LOGO -->
  <div class="mb-2 flex items-center gap-3 border-b border-slate-200 px-4 py-3">
    <div
      class="flex min-h-12 min-w-12 items-center justify-center bg-gradient-to-br from-violet-500 to-purple-800 transition-all duration-300"
      [class.rounded-full]="collapsed()"
      [class.rounded-xl]="!collapsed()"
      [class.scale-90]="collapsed()"
    >
      <lucide-icon [img]="Icons.Wallet" class="text-primary-foreground"></lucide-icon>
    </div>

    <span
      class="font-display overflow-hidden whitespace-nowrap font-semibold text-foreground transition-all duration-300"
      [class.opacity-0]="collapsed()"
      [class.w-0]="collapsed()"
    >
      Projeto Bank
    </span>
  </div>

  <nav class="flex flex-1 flex-col gap-1 overflow-y-auto px-2 text-sm">
    <!-- MENU GROUPS -->
    @for (group of menuGroups; track group.title) {
      @if (!collapsed()) {
        <p
          class="mt-2 px-2 text-xs font-semibold uppercase tracking-wider text-muted-foreground transition-all duration-200"
        >
          {{ group.title }}
        </p>
      }

      @for (item of group.items; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="text-violet-700 bg-violet-200 hover:bg-violet-100 hover:text-violet-900"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center rounded-lg px-3 py-2 text-sidebar-foreground transition-colors duration-200 hover:bg-muted hover:text-foreground"
          [class.justify-center]="collapsed()"
          [class.gap-3]="!collapsed()"
        >
          <lucide-icon [img]="item.icon" class="h-4 w-4"> </lucide-icon>

          <span
            class="overflow-hidden whitespace-nowrap transition-all duration-300"
            [class.opacity-0]="collapsed()"
            [class.w-0]="collapsed()"
            [class.max-w-[160px]]="!collapsed()"
          >
            {{ item.label }}
          </span>
        </a>
      }
    }
  </nav>

  <!-- TOGGLE BUTTON -->
  <div class="mt-auto flex justify-center">
    <button
      (click)="toggleSidebar()"
      class="absolute top-15 -right-3 flex h-6 w-6 items-center justify-center rounded-full border border-border bg-card shadow-sm transition-all duration-500 hover:bg-muted"
    >
      <lucide-icon
        [img]="!collapsed() ? Icons.ArrowLeftToLine : Icons.ArrowRightFromLine"
        class="h-4 w-4 text-muted-foreground"
      >
      </lucide-icon>
    </button>
  </div>

  <!-- FOOTER -->
  @if (!collapsed()) {
    <div class="border-t border-border p-3 text-xs text-muted-foreground">
      <div
        class="flex w-full items-center justify-between rounded-xl bg-secondary p-3 text-secondary-foreground"
      >
        <!-- LADO ESQUERDO -->
        <div class="flex flex-col gap-1">
          <!-- TÍTULO -->
          <div class="mb-2 flex items-start gap-1">
            <lucide-icon [img]="Icons.Landmark" class="h-4 w-4"></lucide-icon>

            <p class="uppercase tracking-wider">Dados da conta</p>
          </div>

          <!-- INFO -->
          <p>
            Ag
            <span class="tracking-wider text-foreground">
              {{ ag }}
            </span>
          </p>

          <p>
            Cc
            <span class="tracking-wider text-foreground">
              {{ cc }}
            </span>
          </p>
        </div>

        <!-- BOTÃO COPIAR -->
        <button
          (click)="copyInfo()"
          class="flex items-center justify-center rounded-xl p-2 transition-all duration-300 hover:bg-violet-100 hover:text-primary"
        >
          <lucide-icon
            [img]="copied() ? Icons.Check : Icons.Copy"
            class="h-4 w-4 transition-all duration-300"
            [class.scale-125]="copied"
            [class.text-success]="copied"
          >
          </lucide-icon>
        </button>
      </div>
    </div>
  }
</aside>
