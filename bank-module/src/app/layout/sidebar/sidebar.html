<aside
  class="relative h-screen bg-white border-r border-slate-200 transition-all duration-300 overflow-visible flex flex-col"
  [class.w-[260px]]="!collapsed()"
  [class.w-[72px]]="collapsed()"
>
  <nav class="flex flex-col gap-2 p-2">
    <!-- LOGO -->
    <div class="flex items-center gap-3 px-4 py-4 border-b border-slate-200 mb-2">
      <div
        class="w-12 h-12 rounded-3xl bg-gradient-to-br from-violet-500 to-purple-800 flex items-center justify-center"
      >
        <lucide-icon [img]="Wallet" class="w-6 h-6 text-white"></lucide-icon>
      </div>

      @if (!collapsed()) {
        <span class="font-semibold text-slate-800"> Projeto Bank </span>
      }
    </div>

    @for (group of menuGroups; track group.title) {
      @if (!collapsed()) {
        <p class="mt-2 px-4 text-xs font-semibold uppercase tracking-wider text-slate-400">
          {{ group.title }}
        </p>
      }

      @for (item of group.items; track item.label) {
        <a
          class="flex items-center px-4 py-3 rounded-2xl transition-all duration-500 hover:bg-slate-100 hover:text-slate-900"
          [class.justify-center]="collapsed()"
          [class.gap-3]="!collapsed()"
        >
          <lucide-icon [img]="item.icon" class="w-5 h-5"> </lucide-icon>

          @if (!collapsed()) {
            <span>
              {{ item.label }}
            </span>
          }
        </a>
      }
    }
  </nav>

  <!-- FOOTER -->
  <div class="mt-auto p-4 flex justify-center">
    <button
      (click)="toggleSidebar()"
      class="absolute top-18 -right-4 w-8 h-8 flex items-center justify-center rounded-full border border-slate-200 bg-white shadow-md hover:bg-slate-100 transition-all duration-300"
    >
      <lucide-icon [img]="!collapsed() ? ArrowLeftToLine : ArrowRightFromLine" class="w-4 h-4 text-slate-500">
      </lucide-icon>
    </button>
  </div>
</aside>
